services:
  - type: web
    name: giro-backend-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: BAAS_ENABLED
        value: "false"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GIRO_JWT_SECRET_BASE64
        sync: false
      - key: GIRO_ENCRYPTION_KEY_BASE64
        sync: false
