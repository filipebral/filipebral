    name: "@FeignClient(name=baasClient)"
    source_loc: "giro-app/backend/src/main/java/com/giro_app/backend/BaaSFeignClient.java:7"
    target: "POST /accounts"
    must_appear_in_target: true
    notes: "Provider adapter selected by URL."
  - type: annotation
    name: "@Profile(!prod)"
    source_loc: "giro-app/backend/src/main/java/com/giro_app/backend/BaasMockController.java:10"
    target: "mock controller"
    must_appear_in_target: true
    notes: "Test double must never be exposed by production."
runtime_config:
