        line: 16
      - path: giro-app/components/ProcessSplitModal.tsx
        line: 23
      - path: giro-app/lib/financial-simulations.ts
        line: 19
    exported_signature:
      - method: "Dashboard() -> React page"
        source_loc: "giro-app/app/dashboard/page.tsx:10"
        stability: frozen
      - method: "simulateLoan(Input) -> {total,interest,installment}; simulateInvestment(Input) -> {total,interest}"
        source_loc: "giro-app/lib/financial-simulations.ts:19"
        stability: must_preserve
    dynamic_entrypoints:
      - target: "Next.js App Router dashboard page"
        mechanism: convention
        source_loc: "giro-app/app/dashboard/page.tsx:1"
    depends_on:
      - unit: next-api-boundary
        via: "same-origin /api/proxy/* calls"
      - unit: next-auth-bff
        via: "POST /api/auth/logout"
    shared_refs:
      - module: simulation-domain-contract
        used_fields: [account_balance, transaction_view, schedule_view, bill_view]
      - module: split-domain-contract
        used_fields: [group_response, transaction_response]

  - name: next-auth-bff
    trigger: api
    trigger_detail: "POST /api/auth/login, POST /api/auth/register, POST /api/auth/logout"
    source_anchors:
      - path: giro-app/app/api/auth/login/route.ts
        line: 4
      - path: giro-app/app/api/auth/register/route.ts
        line: 4
      - path: giro-app/app/api/auth/logout/route.ts
        line: 4
      - path: giro-app/lib/auth-server.ts
        line: 6
    exported_signature:
      - method: "POST /api/auth/login|register -> {user:{id,name}}; sets giro_access_token cookie"
        source_loc: "giro-app/lib/auth-server.ts:6"
        stability: frozen
      - method: "POST /api/auth/logout -> {success:true}; expires giro_access_token cookie"
        source_loc: "giro-app/app/api/auth/logout/route.ts:4"
        stability: frozen
    dynamic_entrypoints:
      - target: "Next.js route handlers"
        mechanism: convention
        source_loc: "giro-app/app/api/auth/login/route.ts:1"
    depends_on:
      - unit: backend-auth-api
        via: "server-side POST /api/auth/login|register"
    shared_refs:
      - module: security-cookie-contract
        used_fields: [access_cookie_name, token_lifetime, cookie_policy]

  - name: next-api-boundary
    trigger: api
    trigger_detail: "GET|HEAD|POST|PUT|PATCH|DELETE /api/proxy/[...path]"
    source_anchors:
      - path: giro-app/app/api/proxy/[...path]/route.ts
        line: 5
      - path: giro-app/proxy.ts
        line: 46
    exported_signature:
      - method: "forward(request,path) -> backend status/body with cookie removed and Authorization: Bearer <JWT>"
        source_loc: "giro-app/app/api/proxy/[...path]/route.ts:5"
        stability: frozen
      - method: "proxy(request) -> next or redirect / for /dashboard/*"
        source_loc: "giro-app/proxy.ts:46"
        stability: must_preserve
    dynamic_entrypoints:
      - target: "Next.js catch-all route handlers and middleware proxy"
        mechanism: convention
        source_loc: "giro-app/app/api/proxy/[...path]/route.ts:1"
    depends_on:
      - unit: backend-auth-api
        via: "JWT issuer/audience/expiry validation contract"
      - unit: backend-account-provider-api
        via: "POST /accounts"
      - unit: backend-simulation-api
        via: "/simulation/*"
      - unit: backend-split-api
        via: "/api/split-*"
    shared_refs:
      - module: security-cookie-contract
        used_fields: [access_cookie_name, jwt_claims, cookie_policy]

