units:
  - name: next-auth-experience
    trigger: page
    trigger_detail: "GET / with POST actions to /api/auth/login and /api/auth/register"
    source_anchors:
      - path: giro-app/app/page.tsx
        line: 6
    exported_signature:
      - method: "Home() -> React page; submits {cpf,password} or {cpf,name,password}"
        source_loc: "giro-app/app/page.tsx:6"
        stability: frozen
    dynamic_entrypoints:
      - target: "Next.js App Router page"
        mechanism: convention
        source_loc: "giro-app/app/page.tsx:1"
    depends_on:
      - unit: next-auth-bff
        via: "same-origin POST /api/auth/login|register"
    shared_refs:
      - module: security-cookie-contract
        used_fields: [access_cookie_name]

  - name: next-dashboard-experience
    trigger: page
    trigger_detail: "GET /dashboard plus modal and simulation actions"
    source_anchors:
