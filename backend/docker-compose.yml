version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: giro-rabbitmq
    ports:
      - "5672:5672"   # Porta padrão de comunicação da aplicação (AMQP)
      - "15672:15672" # Painel visual (Acesse localhost:15672 no navegador)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data: