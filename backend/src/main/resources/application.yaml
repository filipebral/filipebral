server:
  port: ${PORT:8080}

baas:
  api:
    url: "http://localhost:8080/mock-baas"
  enabled: ${BAAS_ENABLED:false}
app:
  security:
    jwt:
      secret-base64: ${GIRO_JWT_SECRET_BASE64}
    encryption:
      key-base64: ${GIRO_ENCRYPTION_KEY_BASE64}
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    listener:
      simple:
        auto-startup: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never